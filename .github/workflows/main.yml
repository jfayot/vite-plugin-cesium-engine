name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: "https://registry.npmjs.org"
      - name: Build
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - run: pnpm i
      - run: pnpm test
      - run: pnpm build:all
